<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CFD Calculator</title>

<style>

body{
    margin:0;
    padding:20px;
    background:#111;
    color:white;
    font-family:Arial;
}

.wrapper{
    max-width:800px;
    margin:auto;
}

.title{
    font-size:32px;
    margin-bottom:20px;
    text-align:center;
    font-weight:bold;
}

.card{
    background:#1d1d1d;
    padding:20px;
    border-radius:20px;
    margin-bottom:20px;
}

.field{
    margin-bottom:20px;
}

.label{
    margin-bottom:8px;
    font-size:18px;
}

input, select{
    width:100%;
    height:55px;
    border:none;
    border-radius:12px;
    background:#2b2b2b;
    color:white;
    font-size:24px;
    text-align:center;
}

button{
    width:100%;
    height:60px;
    border:none;
    border-radius:14px;
    background:#16a34a;
    color:white;
    font-size:24px;
    cursor:pointer;
}

.result{
    background:#2a2a2a;
    padding:14px;
    border-radius:12px;
    margin-bottom:12px;
}

.result-name{
    font-size:15px;
    opacity:0.8;
}

.result-value{
    font-size:30px;
    font-weight:bold;
}

</style>
</head>

<body>

<div class="wrapper">

<div class="title">
Человек как источник тепла и CO₂
</div>

<div class="card">

<div class="field">
<div class="label">Масса (кг)</div>
<input id="mass" value="75">
</div>

<div class="field">
<div class="label">Рост (см)</div>
<input id="height" value="175">
</div>

<div class="field">
<div class="label">MET</div>
<input id="met" value="1.6">
</div>

<div class="field">
<div class="label">Температура воздуха (°C)</div>
<input id="temp" value="24">
</div>

<div class="field">
<div class="label">Влажность (%)</div>
<input id="rh" value="50">
</div>

<button onclick="calc()">
Рассчитать
</button>

</div>

<div class="card">

<div class="result">
<div class="result-name">Площадь тела (м²)</div>
<div class="result-value" id="A_out">0</div>
</div>

<div class="result">
<div class="result-name">Полная тепловая мощность (Вт)</div>
<div class="result-value" id="Q_total">0</div>
</div>

<div class="result">
<div class="result-name">Явное тепло (Вт)</div>
<div class="result-value" id="Q_sens">0</div>
</div>

<div class="result">
<div class="result-name">Скрытое тепло (Вт)</div>
<div class="result-value" id="Q_lat">0</div>
</div>

<div class="result">
<div class="result-name">CO₂ (л/ч)</div>
<div class="result-value" id="co2_lh">0</div>
</div>

<div class="result">
<div class="result-name">CO₂ (кг/ч)</div>
<div class="result-value" id="co2_kgh">0</div>
</div>

<div class="result">
<div class="result-name">CO₂ (кг/с)</div>
<div class="result-value" id="co2_kgs">0</div>
</div>

<div class="result">
<div class="result-name">Влаговыделение (г/ч)</div>
<div class="result-value" id="H2O_gh">0</div>
</div>

</div>

</div>

<script>

function val(id, def){
    let v = document.getElementById(id).value;
    v = parseFloat(v);
    return isNaN(v) ? def : v;
}

function setOut(id,val,fix){
    document.getElementById(id).innerHTML = Number(val).toFixed(fix);
}

function calc(){

    let m   = val('mass',75);
    let h   = val('height',175);
    let MET = val('met',1.6);
    let T   = val('temp',24);
    let RH  = val('rh',50);

    let A = 0.007184 * Math.pow(m,0.425) * Math.pow(h,0.725);

    let M = MET * 58.2 * A;

    let Psat = 610.78 * Math.exp((17.27 * T) / (T + 237.3));
    let Pv = Psat * RH / 100;

    let evap = 1 - Pv / Psat;

    let sens = 0.65;

    let Q_lat = M * (1 - sens) * evap;
    let Q_sens = M - Q_lat;

    let H2O = Q_lat / 2450000;

    let VO2 = (3.5 * MET * m) / 1000 / 60;
    let VCO2 = VO2 * 0.85;
    let CO2 = VCO2 * 1.977 / 1000;

    setOut('A_out',A,2);
    setOut('Q_total',M,0);
    setOut('Q_sens',Q_sens,0);
    setOut('Q_lat',Q_lat,0);
    setOut('co2_lh',VCO2 * 3600,1);
    setOut('co2_kgh',CO2 * 3600,4);
    setOut('co2_kgs',CO2,6);
    setOut('H2O_gh',H2O * 3600 * 1000,1);

}

calc();

</script>

</body>
</html>
